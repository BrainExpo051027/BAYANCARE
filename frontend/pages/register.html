<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAYANCARE - Register</title>
    <link rel="stylesheet" href="../assets/css/bayancare.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, #e9f7ff, #f6fffb);
            color: #212529;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, var(--bc-primary), var(--bc-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #71767b;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #1DA1F2;
            background-color: #1c1f26;
            box-shadow: 0 0 0 4px rgba(29, 161, 242, 0.1);
        }

        .form-input::placeholder {
            color: #71767b;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #1DA1F2;
            box-shadow: 0 0 0 4px rgba(29, 161, 242, 0.1);
        }

        .form-select option {
            background-color: #16181c;
            color: #ffffff;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #1DA1F2;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .register-btn:hover {
            background-color: #1a8cd8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(29, 161, 242, 0.3);
        }

        .register-btn:disabled {
            background-color: #2f3336;
            color: #71767b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            text-align: center;
            color: #71767b;
        }

        .login-link a {
            color: #1DA1F2;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .role-description {
            font-size: 12px;
            color: #71767b;
            margin-top: 4px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
            }

            .title {
                font-size: 20px;
            }

            .form-input, .form-select, .register-btn {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <div class="logo-text">BAYANCARE</div>
        </div>
        
        <h1 class="title">Create your account</h1>
        <p class="subtitle">Join BAYANCARE healthcare system</p>
        
        <div id="register-message"></div>
        
        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="register-username">Username</label>
                <input type="text" id="register-username" class="form-input" placeholder="Choose a username" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="register-email">Email</label>
                <input type="email" id="register-email" class="form-input" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="register-password">Password</label>
                <input type="password" id="register-password" class="form-input" placeholder="Create a strong password" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="register-role">Role</label>
                <select id="register-role" class="form-select" required>
                    <option value="">Select your role</option>
                    <option value="RESIDENT">Resident</option>
                    <option value="BHW">Barangay Health Worker (BHW)</option>
                </select>
                <div class="role-description" id="role-description"></div>
            </div>
            
            <button type="submit" class="register-btn" id="register-submit-btn">
                <span id="register-text">Create account</span>
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script src="../assets/js/api.js?v=3"></script>
    <script>
        // Role descriptions
        const roleDescriptions = {
            'RESIDENT': 'Access health assessments, view announcements, and manage your health profile',
            'BHW': 'Manage announcements, referrals, patient assessments, and system overview'
        };

        // Update role description when role is selected
        document.getElementById('register-role').addEventListener('change', function() {
            const role = this.value;
            const descriptionEl = document.getElementById('role-description');
            descriptionEl.textContent = roleDescriptions[role] || '';
        });

        // Registration form submission
        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const role = document.getElementById('register-role').value;
            
            const submitBtn = document.getElementById('register-submit-btn');
            const registerText = document.getElementById('register-text');
            
            // Show loading state
            submitBtn.disabled = true;
            registerText.innerHTML = '<span class="loading"></span> Creating account...';
            
            try {
                await registerUser(username, email, password, role);
                
                document.getElementById('register-message').innerHTML = `
                    <div class="alert alert-success">
                        Registration successful! Your account has been created. You can now sign in.
                    </div>
                `;
                
                // Reset form
                document.getElementById('register-form').reset();
                document.getElementById('role-description').textContent = '';
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (err) {
                document.getElementById('register-message').innerHTML = `
                    <div class="alert alert-danger">
                        ${err.message}
                    </div>
                `;
                
                // Reset button state
                submitBtn.disabled = false;
                registerText.textContent = 'Create account';
            }
        });

        // Add some interactivity
        document.querySelectorAll('.form-input, .form-select').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
